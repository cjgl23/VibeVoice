name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-syntax:
    name: python-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      # Full inference requires large model weights and GPU resources.
      # These smoke checks intentionally avoid downloading dependencies/models.
      - name: Python syntax
        run: python -m compileall -q vibevoice demo tests
      - name: Metadata smoke tests
        run: python -m unittest discover -s tests -v
